name: Bash and protocol tests
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        image: [ubuntu:24.04, debian:11, debian:12, debian:13]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Run installation, Bash and real protocol tests in a disposable container
        env:
          TEST_IMAGE: ${{ matrix.image }}
          GH_TOKEN: ${{ github.token }}
        run: docker run --rm -e GH_TOKEN -v "$GITHUB_WORKSPACE:/workspace" -w /workspace "$TEST_IMAGE" bash scripts/ci.sh
      - name: Upload credential-free benchmark results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: account-benchmark-${{ strategy.job-index }}
          path: work/account-benchmark.json
